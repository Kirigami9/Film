<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirigami Cinema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background:#10131a; color:#f8f9fa; min-height:100vh; }
    .navbar { background:#191e29; }
    .navbar-brand { font-weight:800; letter-spacing:.5px; color:#ffc107 !important; }
    .nav-link { color:#e8eaf0 !important; }
    .nav-link.active, .nav-link:hover { color:#ffc107 !important; }
    .search-panel { background:#191e29; border:1px solid #2b3242; border-radius:16px; }
    .movie-card { background:#191e29; border:1px solid #2b3242; border-radius:14px; overflow:hidden; height:100%; }
    .poster { width:100%; height:330px; object-fit:cover; background:#272d3a; }
    .poster-placeholder { height:330px; display:flex; align-items:center; justify-content:center; background:#272d3a; color:#adb5bd; }
    .movie-card .card-body { display:flex; flex-direction:column; }
    .movie-plot { color:#c4cad5; font-size:.92rem; }
    .btn-warning { font-weight:600; }
    #status { color:#c4cad5; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-film me-2"></i>CINEMA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCinema" aria-controls="navbarCinema" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCinema">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html"><i class="bi bi-search me-1"></i>Cari Film</a></li>
          <li class="nav-item"><a class="nav-link" href="watchlist.html"><i class="bi bi-bookmark-heart me-1"></i>Watchlist <span id="watchlistCount" class="badge text-bg-warning">0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="text-center mb-4">
      <h1 class="fw-bold">Temukan Film Favoritmu</h1>
      <p class="text-secondary">Cari film, lihat informasi singkatnya, lalu simpan ke watchlist.</p>
    </div>

    <form id="searchForm" class="search-panel p-3 p-md-4 mb-4">
      <label for="keyword" class="form-label">Nama film</label>
      <div class="input-group input-group-lg">
        <input id="keyword" class="form-control" type="search" placeholder="Search film" required>
        <button class="btn btn-warning px-4" type="submit"><i class="bi bi-search me-1"></i>Search</button>
      </div>
    </form>

    <p id="status" class="text-center mb-4" role="status">Masukkan judul film pada kolom pencarian.</p>
    <div id="movieResults" class="row g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="film.js"></script>
</body>
</html>
